# REVIV Disaster Recovery Engine — Production Example Configuration
primary:
  node_id: "prod-vps-primary"
  host: "203.0.113.5"
  heartbeat_url: "http://drwatch.company.internal:8080/api/heartbeat"
  heartbeat_interval_seconds: 5
  db_host: "127.0.0.1"
  db_port: 5432
  db_name: "production"
  db_user: "postgres"
  db_password: "YOUR_SECURE_PASSWORD"

backup:
  s3_bucket: "company-production-dr-backups"
  s3_region: "ap-south-1"
  wal_prefix: "wal/"
  wal_push_interval_seconds: 30
  base_backup_cron: "0 3 * * *"

heartbeat:
  listen_port: 8080
  check_interval: 5s
  suspect_threshold_misses: 3
  down_threshold_misses: 5
  timeout_seconds: 30
  require_confirmation: true
  confirmation_timeout_hours: 2

alerting:
  enabled: true
  webhook_url: "https://hooks.slack.com/services/T00/B00/XXXX"
  slack_url: ""

aws:
  region: "ap-south-1"
  vpc_id: "vpc-0a1b2c3d4e5f6g7h8"
  subnet_id: "subnet-0123456789abcdef0"
  security_group_id: "sg-0123456789abcdef0"
  ami_id: "ami-0dee22c13ea7a9a67"
  instance_type: "t3.small"
  key_pair_name: "prod-dr-key"
  route53_zone_id: "Z0123456789ABCDEF"
  domain: "app.company.com"
  record_type: "A"
  docker_image: "company/app:latest"
  simulate_cloud_ops: false
